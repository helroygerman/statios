name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4.2.2

      - name: Validation du Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4.4.4

      - name: JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Gradle (cache et configuration)
        uses: gradle/actions/setup-gradle@v4.4.4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Tests unitaires, lint et APK debug
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Publication de l'APK debug
        uses: actions/upload-artifact@v4.6.2
        with:
          name: StatusPrep-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publication des rapports (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: StatusPrep-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
